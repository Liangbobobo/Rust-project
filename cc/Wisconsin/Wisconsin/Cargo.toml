[package]
name = "wisconsin"
version = "0.1.0"
edition = "2024"

[lib]
name = "wisconsin_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "wisconsin"
path = "src/main.rs"

[dependencies]
# 现代 RustCrypto 套件 (替代 block-modes)
# Advanced Encryption Standard
# 仅保留核心 AES 块加解密算法，剔除多余辅助特性
aes = { version = "0.9.3", default-features = false }
# 仅保留 CBC 模式与 PKCS#7 块填充 (block-padding)，禁用默认辅助功能
cbc = { version = "0.2.1", default-features = false, features = ["block-padding"] }
# 仅保留核心 HMAC-SHA256 状态机与签名验证
hmac = { version = "0.13.0", default-features = false }
# 仅保留 SHA-256 压缩函数，剔除 sha-224/512 等多余分支
sha2 = { version = "0.11.0", default-features = false }
# 仅保留标准的 encode_slice 和 decode_slice 接口，剔除 std::io 和堆分配逻辑
base64 = { version = "0.23.1", default-features = false }
# 仅显式开启系统原生随机源 sys_rng (通过 Windows API) 与 thread_rng (生成 16B IV 所必须)，剥离多余特性.这里的std特性是否可以去掉,待评估
rand = { version = "0.10.3", default-features = false, features = ["sys_rng", "thread_rng"] }

# 协议与序列化依赖 (禁用 default-features，仅按需启用 alloc/std)
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc","std"] }
obfstr = "0.4.6"

[profile.release]
opt-level = "z"         # 体积极致优化 (Binary Size Optimization)
lto = "fat"             # 全局胖链接时优化 (Fat Link-Time Optimization)，最大化跨 crate 死代码消除
codegen-units = 1       # 单代码生成单元，消除并行代码生成边界冗余，最大化 LTO 内联与分析深度
panic = "abort"         # 禁用栈展开 (Unwind)，剔除所有展开表与异常处理元数据
strip = "symbols"       # 剥离所有调试符号与符号表
debug = false           # 关闭调试信息
overflow-checks = false # 关闭溢出检查开销
rpath = false           # 关闭运行时库路径嵌入

